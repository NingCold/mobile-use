[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-use"
version = "0.16.0"
description = "Local Android observation and gesture tools for Codex"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "uiautomator2==3.7.0",
    "pillow>=11,<13",
    "filelock>=3.16,<4",
    "defusedxml>=0.7,<1",
    "rapidocr==3.10.0",
    "onnxruntime>=1.23,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mobile-use = "mobile_use.server:main"

[project.urls]
Repository = "https://github.com/NingCold/mobile-use"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
